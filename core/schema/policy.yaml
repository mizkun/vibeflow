# VibeFlow Policy Schema — Single Source of Truth (v6 Iris-Only)
# This file defines role-based access permissions.
# Generators read this file to produce validate_access.py, settings.json, etc.

roles:
  iris:
    display_name: "Iris"
    can_read:
      - "vision.md"
      - ".vibe/spec/**"
      - "plan.md"
      - ".vibe/context/**"
      - ".vibe/references/**"
      - ".vibe/archive/**"
      - ".vibe/project_state.yaml"
      - ".vibe/sessions/*.yaml"
      - ".vibe/state.yaml"
      - "src/**"
    can_write:
      - "vision.md"
      - "plan.md"
      - ".vibe/**"
    enforcement: hard

  coding_agent:
    display_name: "Coding Agent (Claude Code / Codex)"
    can_read:
      - ".vibe/spec/**"
      - "src/**"
      - "tests/**"
      - ".vibe/project_state.yaml"
      - ".vibe/sessions/*.yaml"
      - ".vibe/state.yaml"
    can_write:
      - "src/*"
      - "tests/*"
      - "**/*.test.*"
      - "**/__tests__/*"
      # To-Be spec: the Coding Agent edits Story/Contract on the issue
      # branch (Issue = Spec 差分). Iris writes spec only at
      # kickoff/Bootstrap and as conversation drafts.
      - ".vibe/spec/**"
      - ".vibe/project_state.yaml"
      - ".vibe/sessions/*.yaml"
      - ".vibe/state.yaml"
      - ".vibe/test-results.log"
      # run ledger: the loop's append-only audit log
      - ".vibe/runs/*.jsonl"
      - ".vibe/reports/**"
    enforcement: hard

# Files always allowed regardless of role
always_allow:
  - ".vibe/project_state.yaml"
  - ".vibe/sessions/*.yaml"
  - ".vibe/state.yaml"
